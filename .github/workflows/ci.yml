name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-y-pruebas:
    name: Compilar y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore

      # Directory.Build.props trata las advertencias como errores
      - name: Compilar
        run: dotnet build -c Release --no-restore

      - name: Revisar paquetes con vulnerabilidades
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          ! grep -q "tiene los siguientes paquetes vulnerables\|has the following vulnerable packages" vulnerables.txt

      - name: Pruebas unitarias
        run: >
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  docker-smoke-test:
    name: Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: build-y-pruebas
    steps:
      - uses: actions/checkout@v4

      # Secretos aleatorios de un solo uso: nada sensible queda en el repositorio
      - name: Generar .env
        run: |
          echo "MSSQL_SA_PASSWORD=Ci$(openssl rand -hex 12)!Aa1" >> .env
          echo "JWT_KEY=$(openssl rand -hex 32)" >> .env
          echo "DEMO_PASSWORD=Demo$(openssl rand -hex 6)!Aa1" >> .env

      - name: Levantar SQL Server, base de datos y API
        run: docker compose up -d --build

      - name: Prueba de humo
        run: |
          set -a; source .env; set +a
          bash docker/smoke-test.sh http://localhost:8080

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v
