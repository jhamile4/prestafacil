server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API vive en otro contenedor; el navegador ve un solo origen (sin CORS)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single Page App: cualquier otra ruta (/clientes/3, /caja…) carga index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
